<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Leo dash：星際儀表板</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0b1120;
            color: white;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .font-orbitron { font-family: 'Orbitron', sans-serif; }

        .glow-border {
            box-shadow: 0 0 10px rgba(74, 222, 128, 0.5), inset 0 0 10px rgba(74, 222, 128, 0.2);
            border-color: #4ade80 !important;
        }
        .glow-border-cyan { box-shadow: 0 0 15px rgba(34, 211, 238, 0.6); border-color: #22d3ee !important; }
        .glow-border-green { box-shadow: 0 0 15px rgba(74, 222, 128, 0.6); border-color: #4ade80 !important; }
        .glow-border-purple { box-shadow: 0 0 15px rgba(168, 85, 247, 0.6); border-color: #a855f7 !important; }
        .glow-border-orange { box-shadow: 0 0 15px rgba(251, 146, 60, 0.6); border-color: #fb923c !important; }

        .progress-gradient { background: linear-gradient(90deg, #22d3ee, #4ade80, #facc15, #a855f7); }
        .calendar-bg { background: linear-gradient(180deg, #1e293b, #0f172a); }

        @keyframes flashEffect {
            0% { background-color: rgba(255, 255, 255, 0.8); transform: scale(1.05); }
            100% { background-color: transparent; transform: scale(1); }
        }
        .task-flash { animation: flashEffect 0.4s ease-out; }

        @keyframes bounceGlowBlue {
            0%, 100% { transform: translateY(0); text-shadow: 0 0 15px rgba(59, 130, 246, 0.8); }
            50% { transform: translateY(-3px); text-shadow: 0 0 25px rgba(59, 130, 246, 1); }
        }
        .anim-bounce-glow-blue { animation: bounceGlowBlue 2s infinite ease-in-out; }

        @keyframes pulseScale {
            0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(250, 204, 21, 0.5); }
            50% { transform: scale(1.05); box-shadow: 0 0 25px rgba(250, 204, 21, 0.9); }
        }
        .anim-pulse-scale { animation: pulseScale 1.5s infinite ease-in-out; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // 【修復】安全降級機制：防止 Framer Motion 動畫引擎載入失敗導致「一片黑」
        const fallbackMotion = {
            div: (props) => { const { initial, animate, exit, transition, whileTap, ...rest } = props; return <div {...rest} />; },
            button: (props) => { const { initial, animate, exit, transition, whileTap, ...rest } = props; return <button {...rest} />; }
        };
        const motion = window.Motion ? window.Motion.motion : fallbackMotion;
        const AnimatePresence = window.Motion ? window.Motion.AnimatePresence : ({children}) => <>{children}</>;

        // 🔴🔴🔴 請務必把引號內的文字，換成您的 Google Apps Script 網址 🔴🔴🔴
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyfroi4IYTg7gzUHT-FH_QtHescW43IGQ1YuGe3-UYn15ZMmNFv5CoaYIT9ZwsKTyjY6A/exec";
        
        // 更新儲存版號，強迫系統清除舊的錯誤快取
        const LOCAL_STORAGE_KEY = "leo_dash_local_data_v6";

        // --- SVG 圖示 ---
        const X = ({ size=24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );
        const Check = ({ size=24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        );
        const Chest = ({ size=24 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="8" width="18" height="12" rx="2" ry="2"></rect><path d="M12 8v12"></path><path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
        );
        const Trash2 = ({ size=20 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        );
        const CloudSync = ({ size=18, isSyncing }) => (
            <svg className={isSyncing ? "animate-spin text-cyan-400" : "text-gray-500"} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        );

        // --- 遊戲資料 ---
        const RANKS = [
            { name: "Bronze", req: 0, color: "#CD7F32" },
            { name: "Silver", req: 600, color: "#C0C0C0" },
            { name: "Gold", req: 1200, color: "#FFD700" },
            { name: "Platinum", req: 1800, color: "#E5E4E2" },
            { name: "Diamond", req: 2400, color: "#b9f2ff" },
            { name: "Onyx", req: 3000, color: "#353839" },
            { name: "Nemesis", req: 3600, color: "#800080" }
        ];

        const DAILY_TASKS = [
            { id: "t1", name: "英文線上APP", exp: 10, icon: "📱", type: "routine" },
            { id: "t2", name: "長頸鹿英文功課", exp: 15, icon: "📝", type: "routine" },
            { id: "t3", name: "完成測驗/評量", exp: 25, icon: "🏆", type: "challenge" },
            { id: "t4", name: "主動上床睡覺", exp: 15, icon: "🌙", type: "self" },
            { id: "t5", name: "管理好情緒", exp: 20, icon: "🧘", type: "hidden" },
            { id: "t6", name: "主動幫忙家事", exp: 5, icon: "🧹", type: "bonus" },
            { id: "t7", name: "平日考試優秀", exp: 0, icon: "💯", type: "exam" },
        ];

        const DAILY_REMINDERS = {
            1: "週一提醒：使用線上英文ＡＰＰ，週三前完成自社評量",
            2: "週二提醒：寫長頸鹿英文功課",
            3: "週三提醒：寫自社評量",
            4: "週四提醒：寫長頸鹿英文功課",
            5: "週五提醒：使用線上英文ＡＰＰ",
            6: "週六提醒：寫數學國語評量",
            0: "週日提醒：寫長頸鹿英文功課，聯絡簿簽名確認"
        };

        const STRATEGIES = [
            { id: "s1", title: "閃電預載", desc: "9:30前完成任務且整理好明天書包", exp: 20, icon: "⚡", category: "SPEEDRUN", color: "cyan" },
            { id: "s2", title: "深度邏輯修復", desc: "畫重點並用畫圖/Scratch解釋不懂的邏輯", exp: 35, icon: "🔧", category: "BUG FIX", color: "green" },
            { id: "s3", title: "驚喜彩蛋", desc: "主動觀察家人需求(幫忙拿東西等)", exp: 10, icon: "🤝", category: "NPC", color: "purple" },
            { id: "s4", title: "協作任務", desc: "配合家庭計畫且全程保持心情愉快", exp: 30, icon: "🤝", category: "NPC", color: "purple" },
            { id: "s5", title: "系統冷卻", desc: "答案跟想像不同時，先深呼吸5秒再說", exp: 25, icon: "🛡️", category: "ANTI-TILT", color: "orange" }
        ];

        const WEEKLY_GOAL = 300;

        const getWeekStart = (dateObj = new Date()) => {
            const d = new Date(dateObj);
            const day = d.getDay();
            const diff = d.getDate() - day + (day === 0 ? -6 : 1); 
            d.setDate(diff);
            d.setHours(0,0,0,0);
            return d.getTime();
        };

        const formatDate = (dateObj) => {
            return `${dateObj.getFullYear()}/${dateObj.getMonth() + 1}/${dateObj.getDate()}`;
        };

        const LeoHeroDashboard = () => {
            const [totalExp, setTotalExp] = useState(0);
            const [weeklyExp, setWeeklyExp] = useState(0);
            const [taskLog, setTaskLog] = useState([]);
            
            const [calendarDate, setCalendarDate] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState(new Date());
            const selectedDateStr = formatDate(selectedDate);
            
            const [systemMsg, setSystemMsg] = useState("");
            const [flashingTask, setFlashingTask] = useState(null);
            
            const [isStrategyOpen, setIsStrategyOpen] = useState(false);
            const [isReviewOpen, setIsReviewOpen] = useState(false);
            const [isExamModalOpen, setIsExamModalOpen] = useState(false);
            const [isReminderOpen, setIsReminderOpen] = useState(false);
            const [currentReminderText, setCurrentReminderText] = useState("");
            
            const [isSyncing, setIsSyncing] = useState(false);
            const [spendInput, setSpendInput] = useState("");
            const [checkedDays, setCheckedDays] = useState({});

            const realToday = new Date();
            const todayStr = formatDate(realToday);

            // 背景同步機制
            const syncFromCloud = async (isManual = false) => {
                if (!GAS_API_URL.startsWith("https://script.google.com")) {
                    if (isManual) showSystemMessage("⚠️ 請先在程式碼設定 GAS 網址！");
                    return;
                }

                if (isManual) setIsSyncing(true);
                try {
                    const res = await fetch(GAS_API_URL);
                    const data = await res.json();
                    
                    if (data.totalExp !== undefined) {
                        const currentWeekStart = getWeekStart();
                        const isSameWeek = data.weekStart === currentWeekStart;
                        
                        // 【淨化防護】確保雲端抓下來的資料絕對不會是負數
                        const safeTotal = Math.max(0, data.totalExp);
                        const safeWeekly = isSameWeek ? Math.max(0, data.weeklyExp) : 0;
                        
                        setTotalExp(safeTotal);
                        setWeeklyExp(safeWeekly);
                        
                        const combinedLog = [...(data.taskLog || []), ...(data.strategyLog || [])].map(item => ({
                            id: "cloud_" + Math.random().toString(36).substr(2, 9), 
                            date: item.date, 
                            name: item.name, 
                            exp: item.exp 
                        }));
                        setTaskLog(combinedLog);

                        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({
                            totalExp: safeTotal,
                            weeklyExp: safeWeekly,
                            weekStart: currentWeekStart,
                            taskLog: combinedLog
                        }));
                    }
                } catch (e) {
                    console.error("Cloud Sync Failed", e);
                } finally {
                    if (isManual) {
                        setIsSyncing(false);
                        showSystemMessage("✅ 雲端同步完成！");
                    }
                }
            };

            useEffect(() => {
                try {
                    const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
                    if (saved) {
                        const data = JSON.parse(saved);
                        const currentWeekStart = getWeekStart();
                        if (data.weekStart === currentWeekStart) {
                            setTotalExp(Math.max(0, data.totalExp || 0));
                            setWeeklyExp(Math.max(0, data.weeklyExp || 0));
                            setTaskLog(data.taskLog || []);
                        } else {
                            // 【每週一循環防護】新的一週自動將週進度歸零
                            setTotalExp(Math.max(0, data.totalExp || 0));
                            setWeeklyExp(0);
                            setTaskLog(data.taskLog || []);
                        }
                    }
                } catch (e) {
                    console.error("讀取本地資料失敗", e);
                }
                
                try {
                    const savedChecks = localStorage.getItem(LOCAL_STORAGE_KEY + "_checks");
                    if (savedChecks) setCheckedDays(JSON.parse(savedChecks));
                } catch (e) {
                    console.error("讀取打勾狀態失敗", e);
                }

                syncFromCloud();

                // 【修復】移除 10 秒自動重新整理，避免 Google 試算表還沒更新完，
                // 就把舊資料抓下來覆蓋掉剛點選的任務（這就是點選後消失的原因）
            }, []);

            const saveData = (newTotal, newWeekly, newLog, bgSyncAction = null) => {
                // 【終極防線】儲存前再次確保不低於 0
                const safeTotal = Math.max(0, newTotal);
                const safeWeekly = Math.max(0, newWeekly);

                setTotalExp(safeTotal);
                setWeeklyExp(safeWeekly);
                setTaskLog(newLog);

                localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({
                    totalExp: safeTotal,
                    weeklyExp: safeWeekly,
                    weekStart: getWeekStart(),
                    taskLog: newLog
                }));

                if (bgSyncAction && GAS_API_URL.startsWith("https://script.google.com")) {
                    setIsSyncing(true);
                    fetch(GAS_API_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            totalExp: safeTotal,
                            weeklyExp: safeWeekly,
                            weekStart: getWeekStart(),
                            ...bgSyncAction
                        })
                    }).then(() => {
                        setIsSyncing(false);
                    }).catch(() => setIsSyncing(false));
                }
            };

            // 【新增功能】一鍵重置系統
            const handleHardReset = () => {
                if (confirm("⚠️ 警告：確定要將『所有點數』與『本週紀錄』強制歸零嗎？\n這將修復亂掉的問題，且無法復原！")) {
                    saveData(0, 0, [], { action: "reset_system", date: todayStr, taskName: "系統強制歸零", exp: 0, status: "approved" });
                    alert("已成功歸零！現在是全新的開始！");
                    setIsReviewOpen(false);
                }
            };

            const showSystemMessage = (msg) => {
                setSystemMsg(msg);
                setTimeout(() => setSystemMsg(""), 3000);
            };

            const triggerConfetti = () => {
                confetti({ particleCount: 60, spread: 70, origin: { y: 0.8 }, colors: ['#4ade80', '#facc15', '#22d3ee'] });
            };

            const isTimestampInCurrentWeek = (ts) => {
                const ws = getWeekStart();
                const we = ws + (6 * 24 * 60 * 60 * 1000) + 86399999;
                return ts >= ws && ts <= we;
            };

            const handleDateClick = (cellDate) => {
                if (cellDate.getTime() > realToday.setHours(23,59,59,999)) {
                    alert("未來日期還不能預先填寫喔！");
                    return;
                }
                setSelectedDate(cellDate);
                const dayOfWeek = cellDate.getDay(); 
                setCurrentReminderText(DAILY_REMINDERS[dayOfWeek]);
                setIsReminderOpen(true);
            };

            const handleTaskClick = (taskObj, customExp = null, customName = null) => {
                const finalExp = customExp !== null ? customExp : taskObj.exp;
                const finalName = customName !== null ? customName : taskObj.name;
                
                const existingIndex = taskLog.findIndex(t => t.name === finalName && t.date === selectedDateStr);
                
                let newTotal = totalExp;
                let newWeekly = weeklyExp;
                let newLog = [...taskLog];
                const isCurrentWeek = isTimestampInCurrentWeek(selectedDate.getTime());
                let bgAction = null;

                if (existingIndex > -1) {
                    const removedExp = newLog[existingIndex].exp;
                    newLog.splice(existingIndex, 1);
                    // 【防護】取消任務時，分數最少扣到 0
                    newTotal = Math.max(0, newTotal - removedExp);
                    if (isCurrentWeek) newWeekly = Math.max(0, newWeekly - removedExp);
                    bgAction = { action: "remove_task", date: selectedDateStr, taskName: finalName, exp: removedExp };
                } else {
                    setFlashingTask(taskObj.id);
                    setTimeout(() => setFlashingTask(null), 400);
                    triggerConfetti();
                    newLog.push({ id: taskObj.id, date: selectedDateStr, name: finalName, exp: finalExp });
                    newTotal += finalExp;
                    if (isCurrentWeek) newWeekly += finalExp;
                    bgAction = { action: "add_task", date: selectedDateStr, taskName: finalName, exp: finalExp, status: "approved" };
                }
                saveData(newTotal, newWeekly, newLog, bgAction);
            };

            const handleExamSelect = (scoreExp) => {
                const taskName = scoreExp === 20 ? "平日考試優秀 (90-95分)" : "平日考試優秀 (80-89分)";
                handleTaskClick({ id: "t7" }, scoreExp, taskName);
                setIsExamModalOpen(false);
            };

            const handleCustomSpend = () => {
                const deduction = parseInt(spendInput);
                if (isNaN(deduction) || deduction <= 0) {
                    alert("請輸入有效的數字！");
                    return;
                }
                if (deduction > weeklyExp) {
                    alert("扣除點數不能大於本週剩餘可扣點數喔！");
                    return;
                }
                if (confirm(`確定要扣除本週 ${deduction} EXP 嗎？`)) {
                    // 【防護】手動扣點最少扣到 0
                    const newWeekly = Math.max(0, weeklyExp - deduction);
                    const newTotal = Math.max(0, totalExp - deduction);
                    setSpendInput("");
                    triggerConfetti();
                    saveData(newTotal, newWeekly, taskLog, { action: "spend_exp", date: todayStr, itemName: `手動扣除`, cost: deduction });
                    alert("扣點成功！");
                }
            };

            const handleRemoveSingleLog = (logIndexToRemove) => {
                if(confirm("確定要刪除這筆紀錄並扣回點數嗎？")) {
                    const logItem = taskLog[logIndexToRemove];
                    // 【防護】刪除單筆紀錄時最少扣到 0
                    let newTotal = Math.max(0, totalExp - logItem.exp);
                    let newWeekly = weeklyExp;
                    if (isTimestampInCurrentWeek(new Date(logItem.date).getTime())) {
                        newWeekly = Math.max(0, newWeekly - logItem.exp);
                    }
                    let newLog = [...taskLog];
                    newLog.splice(logIndexToRemove, 1);
                    saveData(newTotal, newWeekly, newLog, { action: "remove_task", date: logItem.date, taskName: logItem.name, exp: logItem.exp });
                }
            };

            const toggleDayCheck = (dateString) => {
                const newChecks = { ...checkedDays, [dateString]: !checkedDays[dateString] };
                setCheckedDays(newChecks);
                localStorage.setItem(LOCAL_STORAGE_KEY + "_checks", JSON.stringify(newChecks));
            };

            // 【防護】即使傳入異常值，Rank 計算也不會壞掉
            const safeExpForRank = Math.max(0, totalExp || 0);
            const currentRank = RANKS.slice().reverse().find(r => safeExpForRank >= r.req) || RANKS[0];
            const nextRank = RANKS.find(r => r.req > safeExpForRank) || RANKS[RANKS.length - 1];
            
            // 【修復】防止滿等時「除以零」造成的畫面崩潰
            let progressPercent = 100;
            if (nextRank.req > currentRank.req) {
                progressPercent = Math.min(100, Math.max(0, ((safeExpForRank - currentRank.req) / (nextRank.req - currentRank.req)) * 100));
            }
            const weeklyPercent = Math.min(100, Math.max(0, ((weeklyExp || 0) / WEEKLY_GOAL) * 100));

            const monthYear = calendarDate.getFullYear();
            const monthIndex = calendarDate.getMonth();
            const firstDayOfMonth = new Date(monthYear, monthIndex, 1).getDay();
            const daysInMonth = new Date(monthYear, monthIndex + 1, 0).getDate();
            const monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

            const weekStartTS = getWeekStart();
            const weekEndTS = weekStartTS + (6 * 24 * 60 * 60 * 1000) + 86399999; 

            const calendarBlanks = Array.from({ length: firstDayOfMonth }, (_, i) => <div key={`blank-${i}`} className="p-2 md:p-3"></div>);

            const calendarDays = Array.from({ length: daysInMonth }, (_, i) => {
                const dateNum = i + 1;
                const cellDate = new Date(monthYear, monthIndex, dateNum);
                const cellDateStr = formatDate(cellDate);
                const cellTS = cellDate.getTime();

                const isCurrentWeek = cellTS >= weekStartTS && cellTS <= weekEndTS;
                const isToday = cellDateStr === todayStr;
                const isSelected = cellDateStr === selectedDateStr;
                const isFuture = cellTS > realToday.setHours(23,59,59,999);
                const hasLog = taskLog.some(t => t.date === cellDateStr);

                let cellClasses = "bg-[#1e293b] text-gray-300 rounded mt-1 transition-all duration-200";
                
                if (isCurrentWeek) {
                    cellClasses = "bg-blue-900/40 text-cyan-200 border-y border-cyan-500/50";
                    if (cellDate.getDay() === 0) cellClasses += " rounded-r-md border-r";
                    if (cellDate.getDay() === 1) cellClasses += " rounded-l-md border-l";
                    if (isToday) cellClasses += " border border-yellow-400 bg-blue-800/70 shadow-[0_0_10px_rgba(250,204,21,0.5)] font-bold";
                } else if (isToday) {
                    cellClasses = "bg-cyan-800/60 text-white rounded mt-1 border border-cyan-400 font-bold";
                }
                
                if (isFuture) {
                    cellClasses += " opacity-40 cursor-not-allowed";
                } else {
                    cellClasses += " cursor-pointer hover:bg-cyan-800/50";
                }

                if (isSelected) {
                    cellClasses += " ring-2 ring-white ring-offset-2 ring-offset-[#0b1120] z-10 scale-110 font-bold bg-cyan-700/80 text-white";
                }

                return (
                    <div key={dateNum} onClick={() => handleDateClick(cellDate)} className={`p-2 md:p-3 relative flex justify-center items-center ${cellClasses}`}>
                        {dateNum}
                        {hasLog && <span className="absolute bottom-1 w-1.5 h-1.5 bg-green-400 rounded-full shadow-[0_0_5px_#4ade80]"></span>}
                    </div>
                );
            });

            const currentWeekLogs = taskLog.filter(log => isTimestampInCurrentWeek(new Date(log.date).getTime()));
            const logsByDay = {};
            currentWeekLogs.forEach((log) => {
                if(!logsByDay[log.date]) logsByDay[log.date] = [];
                const realIndex = taskLog.findIndex(t => t === log);
                logsByDay[log.date].push({ ...log, realIndex });
            });
            const sortedDays = Object.keys(logsByDay).sort((a,b) => new Date(b).getTime() - new Date(a).getTime());

            return (
                <div className={`min-h-screen pb-24 flex flex-col items-center relative transition-colors duration-500 bg-[#0b1120]`}>
                    
                    {/* 頂部控制列 */}
                    <div className="w-full max-w-2xl p-4 md:px-8 flex justify-between items-center z-20 gap-2">
                        <div className="flex items-center gap-2 md:gap-5">
                            <h1 className="text-3xl md:text-5xl font-orbitron font-black italic tracking-wider text-cyan-400 anim-bounce-glow-blue whitespace-nowrap" style={{ textShadow: '2px 2px 0 #000' }}>
                                Leo dash
                            </h1>
                            <div className="text-gray-500 cursor-pointer p-1 shrink-0" onClick={() => syncFromCloud(true)} title="點擊強制更新">
                                <CloudSync isSyncing={isSyncing} />
                            </div>
                        </div>
                        <div className="flex items-center gap-2 md:gap-4 shrink-0">
                            <button onClick={() => setIsStrategyOpen(true)} className="anim-pulse-scale bg-yellow-400 text-black px-3 py-1.5 md:px-5 md:py-2 text-sm md:text-base rounded-full font-bold flex items-center gap-1 shadow-[0_0_15px_rgba(250,204,21,0.5)]">
                                📖 攻略
                            </button>
                            <button onClick={() => setIsReviewOpen(true)} className="bg-indigo-600/80 hover:bg-indigo-500 text-white px-3 py-1.5 md:px-5 md:py-2 text-sm md:text-base rounded-xl font-bold flex items-center gap-1 md:gap-2 border border-indigo-400 shadow-[0_0_10px_rgba(99,102,241,0.5)] transition-all">
                                <Chest size={18} /> 總結
                            </button>
                        </div>
                    </div>

                    <AnimatePresence>
                        {systemMsg && (
                            <motion.div initial={{ opacity: 0, y: -20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0 }} className="fixed top-20 z-50 bg-green-500 text-white px-6 py-2 md:py-3 md:text-xl rounded-full font-bold shadow-[0_0_20px_rgba(74,222,128,0.8)]">
                                {systemMsg}
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* 主要區塊 */}
                    <div className="w-full max-w-2xl px-4 md:px-8 flex flex-col gap-5 md:gap-6 z-10 mt-2">
                        <div className="w-full">
                            <div className="flex justify-between items-end mb-1">
                                <div className="text-3xl md:text-4xl font-orbitron font-bold text-white tracking-widest">{totalExp} EXP</div>
                                <div className="text-sm md:text-base font-orbitron text-gray-400">NEXT RANK: {nextRank.req}</div>
                            </div>
                            <div className="h-6 md:h-8 bg-[#1e293b] rounded-full border border-gray-700 overflow-hidden relative shadow-inner">
                                <motion.div className="h-full progress-gradient rounded-full" initial={{ width: 0 }} animate={{ width: `${progressPercent}%` }} transition={{ duration: 0.5 }} />
                            </div>
                        </div>

                        <div className="w-full bg-[#1e293b]/60 border border-indigo-500/50 p-4 md:p-6 rounded-xl hover:border-indigo-400 transition-colors">
                            <div className="flex justify-between items-center mb-2">
                                <div className="flex items-center gap-2 text-cyan-300 font-bold text-lg md:text-xl">
                                    <Chest size={24} /> 週寶箱進度 (週日結算)
                                </div>
                                <div className="text-lg md:text-2xl font-orbitron font-bold text-white">{weeklyExp} / {WEEKLY_GOAL} EXP</div>
                            </div>
                            <div className="h-3 md:h-4 bg-[#0f172a] rounded-full overflow-hidden shadow-inner border border-gray-800">
                                <motion.div className="h-full bg-gradient-to-r from-blue-500 to-indigo-400 rounded-full" initial={{ width: 0 }} animate={{ width: `${weeklyPercent}%` }} transition={{ duration: 0.5 }} />
                            </div>
                        </div>

                        <div className="w-full p-4 md:p-6 rounded-xl border border-gray-700 shadow-2xl calendar-bg mt-2">
                            <div className="flex justify-between items-center mb-4 text-gray-300 font-orbitron font-bold text-lg">
                                <button onClick={() => setCalendarDate(new Date(monthYear, monthIndex - 1, 1))} className="px-3 py-1 hover:text-cyan-400">&lt;Prev</button>
                                <div className="bg-[#0f172a] px-6 py-2 rounded-lg text-white border border-gray-700 text-xl">{monthNames[monthIndex]} {monthYear}</div>
                                <button onClick={() => setCalendarDate(new Date(monthYear, monthIndex + 1, 1))} className="px-3 py-1 hover:text-cyan-400">Next&gt;</button>
                            </div>
                            <div className="grid grid-cols-7 gap-1 text-center font-orbitron text-base text-gray-500 mb-2 font-bold">
                                <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                            </div>
                            <div className="grid grid-cols-7 gap-1 text-center font-orbitron text-xl text-white">
                                {calendarBlanks}{calendarDays}
                            </div>
                        </div>
                        
                        <div className="flex items-center gap-2 pl-1 md:text-lg">
                            <span className="w-2.5 h-2.5 bg-cyan-400 rounded-full animate-pulse"></span>
                            <span className="text-cyan-400 font-bold">編輯中：{selectedDateStr} {selectedDateStr === todayStr ? "(今天)" : ""}</span>
                        </div>

                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4 mt-2">
                            {DAILY_TASKS.map(task => {
                                if (task.id === "t7") {
                                    const examLog = taskLog.find(t => t.name.startsWith("平日考試優秀") && t.date === selectedDateStr);
                                    const isExamSelected = !!examLog;
                                    const examExp = isExamSelected ? examLog.exp : 0;
                                    
                                    return (
                                        <motion.button key={task.id} whileTap={{ scale: 0.95 }}
                                            onClick={() => {
                                                if (isExamSelected) handleTaskClick({ id: "t7" }, examExp, examLog.name);
                                                else setIsExamModalOpen(true);
                                            }}
                                            className={`relative p-4 rounded-xl border flex flex-col items-start justify-center gap-3 transition-colors duration-300 ${isExamSelected ? 'glow-border-green bg-[#064e3b]/80' : 'border-gray-700 bg-[#1e293b]/50'}`}
                                        >
                                            <div className="flex w-full justify-between items-center">
                                                <span className="text-3xl md:text-4xl">{task.icon}</span>
                                                {isExamSelected ? (
                                                    <span className="font-orbitron font-bold text-green-400 text-lg md:text-xl">+{examExp} EXP</span>
                                                ) : (
                                                    <span className="font-orbitron font-bold text-gray-400 text-sm md:text-base border border-gray-600 px-2 rounded">選分數</span>
                                                )}
                                            </div>
                                            <span className="text-base md:text-lg font-bold text-left">{task.name}</span>
                                        </motion.button>
                                    )
                                }

                                const isDone = taskLog.some(t => t.name === task.name && t.date === selectedDateStr);
                                const isFlashing = flashingTask === task.id;
                                
                                return (
                                    <motion.button key={task.id} whileTap={{ scale: 0.95 }} onClick={() => handleTaskClick(task)}
                                        className={`relative p-4 rounded-xl border flex flex-col items-start justify-center gap-3 transition-colors duration-300 ${isDone ? 'glow-border-green bg-[#064e3b]/80' : 'border-gray-700 bg-[#1e293b]/50'} ${isFlashing ? 'task-flash' : ''}`}
                                    >
                                        <div className="flex w-full justify-between items-center">
                                            <span className="text-3xl md:text-4xl">{task.icon}</span>
                                            <span className="font-orbitron font-bold text-gray-300 text-lg md:text-xl">+{task.exp} EXP</span>
                                        </div>
                                        <span className="text-base md:text-lg font-bold text-left">{task.name}</span>
                                    </motion.button>
                                );
                            })}
                        </div>
                    </div>

                    {/* 彈窗：每日提醒 */}
                    <AnimatePresence>
                        {isReminderOpen && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} 
                                className="fixed inset-0 bg-black/90 z-[70] flex justify-center items-center p-4 md:p-8"
                                onClick={(e) => { if (e.target === e.currentTarget) setIsReminderOpen(false); }}
                            >
                                <div className="w-full max-w-sm md:max-w-md bg-[#0f172a] rounded-2xl border border-cyan-500 p-6 flex flex-col gap-4 relative shadow-[0_0_25px_rgba(34,211,238,0.3)]">
                                    <button onClick={() => setIsReminderOpen(false)} className="absolute top-4 right-4 w-10 h-10 bg-red-600/80 hover:bg-red-500 rounded-full flex items-center justify-center text-white shrink-0 shadow-lg">
                                        <X size={24} />
                                    </button>
                                    <h2 className="text-2xl md:text-3xl font-bold text-center text-cyan-400 mb-2 border-b border-gray-700 pb-4 pr-8">
                                        🔔 今日任務提醒
                                    </h2>
                                    <p className="text-white text-xl md:text-2xl font-bold text-center leading-relaxed py-6">
                                        {currentReminderText}
                                    </p>
                                    <button onClick={() => setIsReminderOpen(false)} className="w-full py-4 mt-2 bg-cyan-600/90 text-white text-xl font-bold rounded-xl hover:bg-cyan-500 transition-colors shadow-lg">
                                        我知道了，開始紀錄！
                                    </button>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* 彈窗：考試分數 */}
                    <AnimatePresence>
                        {isExamModalOpen && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 bg-black/90 z-[60] flex justify-center items-center p-4" onClick={(e) => { if (e.target === e.currentTarget) setIsExamModalOpen(false); }}>
                                <div className="w-full max-w-sm bg-[#0f172a] rounded-2xl border border-yellow-500 p-6 flex flex-col gap-4">
                                    <h2 className="text-2xl font-bold text-center text-yellow-400 mb-2 border-b border-gray-700 pb-4">💯 選擇考試成績區間</h2>
                                    <button onClick={() => handleExamSelect(20)} className="w-full py-4 bg-yellow-600/20 border-2 border-yellow-500 text-yellow-400 text-xl font-bold rounded-xl hover:bg-yellow-600/40 transition">90 - 95 分 (+20 EXP)</button>
                                    <button onClick={() => handleExamSelect(10)} className="w-full py-4 bg-indigo-600/20 border-2 border-indigo-500 text-indigo-300 text-xl font-bold rounded-xl hover:bg-indigo-600/40 transition">80 - 89 分 (+10 EXP)</button>
                                    <button onClick={() => setIsExamModalOpen(false)} className="w-full py-3 mt-2 bg-gray-700 text-gray-300 text-lg font-bold rounded-xl hover:bg-gray-600">取消</button>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* 彈窗：攻略本 */}
                    <AnimatePresence>
                        {isStrategyOpen && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 bg-black/90 z-50 flex justify-center p-4 md:p-8 overflow-y-auto" onClick={(e) => { if (e.target === e.currentTarget) setIsStrategyOpen(false); }}>
                                <div className="w-full max-w-2xl bg-[#0f172a] rounded-2xl border border-gray-600 flex flex-col max-h-[90vh] my-auto">
                                    <div className="p-6 pb-4 border-b border-gray-700 flex justify-between items-start shrink-0">
                                        <div>
                                            <h2 className="text-2xl md:text-3xl font-bold text-yellow-400 flex items-center gap-2 mb-2">📖 英雄攻略本</h2>
                                            <div className="text-cyan-400 font-bold md:text-lg">編輯日期：{selectedDateStr}</div>
                                        </div>
                                        <button onClick={() => setIsStrategyOpen(false)} className="w-12 h-12 bg-red-600/80 hover:bg-red-500 rounded-full flex items-center justify-center text-white shrink-0"><X size={28} /></button>
                                    </div>
                                    <div className="p-6 overflow-y-auto">
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3 md:gap-4">
                                            {STRATEGIES.map(s => {
                                                const finalName = `[攻略] ${s.title}`;
                                                const isDone = taskLog.some(log => log.name === finalName && log.date === selectedDateStr);
                                                let colorClass = "glow-border-cyan bg-cyan-900/30";
                                                if(s.color === "green") colorClass = "glow-border-green bg-green-900/30";
                                                if(s.color === "purple") colorClass = "glow-border-purple bg-purple-900/30";
                                                if(s.color === "orange") colorClass = "glow-border-orange bg-orange-900/30";

                                                return (
                                                    <motion.button key={s.id} whileTap={{ scale: 0.95 }} onClick={() => handleTaskClick({ id: s.id }, s.exp, finalName)} className={`relative p-4 rounded-xl border flex flex-col items-start justify-center gap-3 transition-colors duration-300 ${isDone ? colorClass : 'border-gray-700 bg-[#1e293b]/50'}`}>
                                                        <div className="flex w-full justify-between items-center mb-1"><span className="text-3xl">{s.icon}</span><span className={`font-orbitron font-bold text-${s.color}-300 md:text-lg`}>+{s.exp}</span></div>
                                                        <div className="text-left w-full"><div className="font-bold md:text-lg text-gray-200">{s.title}</div><div className="text-xs md:text-sm text-gray-400 mt-1 line-clamp-3">{s.desc}</div></div>
                                                    </motion.button>
                                                )
                                            })}
                                        </div>
                                    </div>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>

                    {/* 彈窗：總結 */}
                    <AnimatePresence>
                        {isReviewOpen && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="fixed inset-0 bg-black/90 z-50 flex justify-center p-4 md:p-8 items-center" onClick={(e) => { if (e.target === e.currentTarget) setIsReviewOpen(false); }}>
                                <div className="w-full max-w-2xl bg-[#0f172a] rounded-2xl border border-indigo-500 flex flex-col max-h-[90vh]">
                                    <div className="p-6 pb-4 border-b border-gray-700 flex justify-between items-start shrink-0">
                                        <div>
                                            <h2 className="text-2xl md:text-3xl font-bold text-white flex items-center gap-2 mb-2">📝 每週總結與點數使用</h2>
                                            <p className="text-cyan-400 md:text-lg">目前顯示：包含 {todayStr} 的這一週</p>
                                        </div>
                                        <button onClick={() => setIsReviewOpen(false)} className="w-12 h-12 bg-red-600/80 hover:bg-red-500 rounded-full flex items-center justify-center text-white shrink-0 ml-4"><X size={28} /></button>
                                    </div>
                                    <div className="p-6 overflow-y-auto flex-1 space-y-6">
                                        <div className="bg-[#1e293b] p-5 md:p-6 rounded-xl border border-indigo-500/50">
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="text-gray-300 text-lg md:text-xl">本週剩餘可扣點數：</span>
                                                <span className="font-orbitron font-bold text-3xl md:text-4xl text-cyan-400">{weeklyExp} EXP</span>
                                            </div>
                                            <div className="flex gap-3">
                                                <input type="number" placeholder="輸入扣除點數" value={spendInput} onChange={(e) => setSpendInput(e.target.value)} className="flex-1 bg-[#0f172a] border border-gray-600 rounded-lg px-4 py-3 text-white text-lg font-orbitron focus:outline-none focus:border-cyan-400"/>
                                                <button onClick={handleCustomSpend} className="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-lg font-bold text-lg whitespace-nowrap transition-colors">確認扣除</button>
                                            </div>
                                        </div>
                                        <div>
                                            <h3 className="text-xl font-bold text-gray-300 mb-4 flex items-center gap-2">📅 本週每日明細：</h3>
                                            {sortedDays.length === 0 ? (
                                                <p className="text-gray-500 text-center py-6 text-lg">本週還沒有任何紀錄喔！</p>
                                            ) : (
                                                sortedDays.map(dateStr => (
                                                    <div key={dateStr} className="mb-4 bg-[#1e293b]/50 border border-gray-700 rounded-xl overflow-hidden">
                                                        <div className="bg-[#1e293b] px-4 py-3 flex justify-between items-center border-b border-gray-700">
                                                            <span className="font-bold text-lg text-white">{dateStr} {dateStr === todayStr ? "(今天)" : ""}</span>
                                                            <label className="flex items-center gap-2 cursor-pointer">
                                                                <span className="text-gray-400 text-sm">家長已閱</span>
                                                                <input type="checkbox" checked={!!checkedDays[dateStr]} onChange={() => toggleDayCheck(dateStr)} className="w-5 h-5 rounded border-gray-600 bg-gray-700 text-green-500 focus:ring-green-500 focus:ring-offset-gray-800"/>
                                                            </label>
                                                        </div>
                                                        <div className="p-2">
                                                            {logsByDay[dateStr].map(log => (
                                                                <div key={log.realIndex} className="flex justify-between items-center p-3 hover:bg-[#0f172a]/50 rounded-lg transition-colors group">
                                                                    <div className="flex items-center gap-3"><span className="text-green-400 bg-green-400/10 p-1 rounded"><Check size={16} /></span><span className="text-gray-200 md:text-lg">{log.name}</span></div>
                                                                    <div className="flex items-center gap-4">
                                                                        <span className="font-orbitron font-bold text-green-400 md:text-xl">+{log.exp}</span>
                                                                        <button onClick={() => handleRemoveSingleLog(log.realIndex)} className="text-gray-500 hover:text-red-400 opacity-50 group-hover:opacity-100 transition-all p-1" title="刪除此紀錄"><Trash2 /></button>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                        
                                        {/* 強制歸零按鈕區塊 */}
                                        <div className="mt-8 border-t border-gray-700 pt-4 flex justify-between items-center">
                                            <span className="text-gray-500 text-sm">系統發生異常時可使用：</span>
                                            <button onClick={handleHardReset} className="bg-red-900/80 hover:bg-red-700 text-red-200 px-4 py-2 rounded-lg font-bold text-sm transition-colors border border-red-700">
                                                ⚠️ 系統重置 (強制歸零)
                                            </button>
                                        </div>

                                    </div>
                                </div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LeoHeroDashboard/>);
    </script>
</body>
</html>
